<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VALORANT BO3 BAN/PICK</title>
  <meta name="description" content="VALORANTのBO3カスタムマッチやスクリム向けマップ決めツールとBAN/PICKツール" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://valorant-api.com" crossorigin />
  <link rel="preconnect" href="https://media.valorant-api.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Oswald:wght@500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body data-mode="bo3">
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="site-header">
    <div class="brand">
      <h1 class="brand-title">VALORANT BO3 BAN/PICK</h1>
    </div>
    <nav class="mode-tabs" aria-label="モード切替">
      <a class="mode-tab" href="index.html">通常</a>
      <a class="mode-tab current" href="bo3.html" aria-current="page">BO3</a>
    </nav>
  </header>

  <main class="layout veto-layout">
    <section class="panel veto-panel">
      <!-- BAN / PICK 事前設定フェーズ -->
      <div class="veto-setup" id="veto-setup">
        <h2>BAN / PICK 設定</h2>

        <div id="team-setup-phase" class="team-setup-phase">
          <p class="setup-step-label">1. チーム名を決める</p>
          <div class="team-inputs">
            <input type="text" id="team1-name" placeholder="クリックして名前を書く" />
            <input type="text" id="team2-name" placeholder="クリックして名前を書く" />
          </div>

          <p class="setup-step-label">2. 先攻・後攻を決める</p>
          <div class="first-pick-container">
            <div class="first-pick-options" id="first-pick-options">
              <button type="button" class="chip-btn fp-btn active" data-val="random">ランダムで決める</button>
              <button type="button" class="chip-btn fp-btn" data-val="1">Team A が先攻</button>
              <button type="button" class="chip-btn fp-btn" data-val="2">Team B が先攻</button>
            </div>
            <button type="button" id="btn-start-veto" class="btn primary" disabled>BAN/PICKを開始する</button>
          </div>
        </div>

        <div id="map-selection-phase">
          <p class="map-selection-label">
            マップを7つ選んでください　(<span id="setup-map-count">0</span>/7)
          </p>
          <ul class="setup-pool-grid" id="selected-7-grid"></ul>
        </div>

        <p id="veto-error" class="status error"></p>
      </div>

      <!-- BAN / PICK 実行フェーズ -->
      <div class="veto-active" id="veto-active" hidden>
        <div class="veto-controls">
          <button type="button" id="btn-veto-undo" class="chip-btn">1つ前に戻す</button>
          <div class="veto-controls-right">
            <button type="button" id="btn-veto-copy" class="chip-btn" hidden>結果をコピーする</button>
            <button type="button" id="btn-veto-reset" class="chip-btn">最初からやり直す</button>
          </div>
        </div>

        <div class="veto-header">
          <h2 id="veto-turn-text">Team A's Turn: BAN a map</h2>
          <p id="veto-instruction-text"></p>
        </div>

        <div id="veto-action-wrapper" class="veto-action-wrapper">
          <div class="veto-action-inner">
            <div id="veto-action-area" class="veto-action-area">
              <div class="veto-pool" id="veto-pool"></div>

              <div class="side-select" id="side-select" hidden>
                <div class="side-btns">
                  <button type="button" class="btn atk" id="btn-atk" data-side="ATTACK">アタッカー</button>
                  <button type="button" class="btn def" id="btn-def" data-side="DEFENSE">ディフェンダー</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="veto-slots" id="veto-slots"></div>
      </div>
    </section>

    <!-- マップ一覧パネル -->
    <section class="panel pool-panel" id="pool-panel">
      <div class="panel-head">
        <h2 class="panel-title">マップ選択</h2>
      </div>
      <ul class="pool-grid" id="pool-grid"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <p>
      本サイトは、Riot Gamesの「Legal Jibber Jabber」ポリシーに基づいて、作成しています。本サイトは<a
        href="https://x.com/ggraciejp" target="_blank" rel="noopener">grajp</a>が作成しています。
    </p>
  </footer>

  <!-- 確認モーダル -->
  <div id="confirm-modal" class="modal-overlay" hidden>
    <div class="modal-content">
      <p id="confirm-msg">マップ選択からやり直しますか？</p>
      <div class="modal-actions">
        <button id="btn-confirm-cancel" class="btn secondary" type="button">キャンセル</button>
        <button id="btn-confirm-ok" class="btn primary" type="button">OK</button>
      </div>
    </div>
  </div>

  <script src="veto.js"></script>
</body>

</html>
